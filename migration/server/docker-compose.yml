services:
  astrbot:
    image: soulter/astrbot:latest
    container_name: astrbot
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - PYTHONPATH=/AstrBot/data/site-packages
    ports:
      # Keep admin panels local. Reach them through Tailscale SSH port forwarding
      # or a Tailscale-only reverse proxy.
      - "127.0.0.1:6185:6185"
    expose:
      - "6199"
    volumes:
      - ./data:/AstrBot/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nightingale-bot

  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - ACCOUNT=1756507015
    ports:
      # NapCat WebUI. Keep local unless you deliberately put it behind Tailscale.
      - "127.0.0.1:6099:6099"
    expose:
      - "3001"
    volumes:
      - ../napcat/qq:/app/.config/QQ
      - ../napcat/config:/app/napcat/config
    depends_on:
      - astrbot
    networks:
      - nightingale-bot

networks:
  nightingale-bot:
    name: nightingale-bot
